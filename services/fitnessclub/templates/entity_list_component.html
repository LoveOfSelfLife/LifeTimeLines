<div id="{{ main_content_container }}">
    <div class="card-body" 
            hx-trigger="entityListChanged from:body" 
            hx-get="{{ entities_listing_route }}" 
            hx-target="#{{main_content_container}}" 
            hx-swap="innerHTML">

        <!-- Fixed search/filter area that doesn't get replaced -->
        <div class="search-filter-area">
            {% if entity_add_route %}
            <button class="btn btn-dark btn-sm"
                hx-get="{{ entity_add_route}}"
                hx-target="#{{ main_content_container }}"
                hx-swap="innerHTML"
                hx-push-url="{{ entity_add_route }}">
                Add New {{ entity_display_name }}
            </button>
            {% endif %}


            <div class="d-flex justify-content-end">
                <div class="btn-group" id="view-toggle-buttons" role="group">
                    <button type="button" class="btn btn-outline-primary {% if view == 'card' %}active{% endif %}" data-view="card"
                        hx-get="{{ entities_listing_route }}&page={{ page }}&filter={{ filter_terms }}&view=card"
                        {% if args %}
                        hx-vals='{{ args|tojson }}'
                        {% endif %}
                        hx-target="#results-area"
                        hx-include="[name='search']">
                        <i class="bi bi-grid"></i>
                    </button>
                    <button type="button" class="btn btn-outline-primary {% if view == 'list' %}active{% endif %}" data-view="list"
                        hx-get="{{ entities_listing_route }}&page={{ page }}&filter={{ filter_terms }}&view=list"
                        {% if args %}
                        hx-vals='{{ args|tojson }}'
                        {% endif %}
                        hx-target="#results-area"
                        hx-include="[name='search']">
                        <i class="bi bi-list"></i>  
                    </button>
                </div>
            </div>

            <script>
                document.addEventListener('htmx:afterRequest', function(e) {
                    if (e.target.closest('#view-toggle-buttons')) {
                        const url = new URL(e.detail.xhr.responseURL || window.location);
                        const view = url.searchParams.get('view') || 'card';
                        
                        document.querySelectorAll('#view-toggle-buttons button').forEach(btn => {
                            btn.classList.remove('active');
                            if (btn.dataset.view === view) {
                                btn.classList.add('active');
                            }
                        });
                    }
                });
            </script>

            {% set search_value = (filter_terms | selectattr('type', 'equalto', 'text') | selectattr('value') | map(attribute='value') | first) or '' %}

            <div class="filter-bar d-flex justify-content-between align-items-center mb-0 p-2 border rounded">
                <input class="form-control" type="search"
                    name="search" placeholder="Begin Typing To Search ..."
                    value="{{ search_value }}"
                    hx-post="{{ entities_listing_route }}"
                    hx-target="#results-area"
                    hx-swap="innerHTML"
                    hx-include="[name='view']"
                    hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
                    hx-indicator=".htmx-indicator">
            </div>

        <!-- Results area that gets replaced -->
        <div id="results-area">
            {% include 'entity_results_partial.html' %}
        </div>
    </div>
</div>
