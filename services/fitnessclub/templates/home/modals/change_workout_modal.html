{# Change Workout Modal Template #}
<div class="modal fade" id="change-workout-modal" tabindex="-1" aria-labelledby="change-workout-modal-label" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="change-workout-modal-label">
          <i class="bi bi-shuffle me-2"></i>Change Workout
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form hx-post="{{ url_for('home.change_workout') }}" 
            hx-target="#scheduled-workouts-content" 
            hx-swap="innerHTML">
        <div class="modal-body">
          <input type="hidden" name="event_id" value="{{ event_id }}">
          
          <p class="text-light opacity-75 mb-3">
            Choose an alternative workout from <strong>{{ program_name }}</strong>:
          </p>
          
          <div class="workout-options">
            {% for workout in alternative_workouts %}
              <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="new_workout_key" 
                       value="{{ workout.key }}" id="workout_{{ workout.key }}">
                <label class="form-check-label" for="workout_{{ workout.key }}">
                  <strong>{{ workout.name }}</strong><br>
                  <small class="text-muted">{{ workout.description }}</small>
                </label>
              </div>
            {% endfor %}
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-info">Change Workout</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Show the modal after it's loaded via HTMX
  document.addEventListener('DOMContentLoaded', function() {
    const modal = new bootstrap.Modal(document.getElementById('change-workout-modal'));
    modal.show();
  });
  // If DOM is already loaded (HTMX case), show immediately
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    const modal = new bootstrap.Modal(document.getElementById('change-workout-modal'));
    modal.show();
  }
</script>
