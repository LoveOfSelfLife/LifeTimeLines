{# Reschedule Workout Modal Template #}
<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="reschedule-modal-label">
        <i class="bi bi-calendar-event me-2"></i>Reschedule Workout for {{ event.member}}
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <form hx-post="{{ url_for('home.reschedule_workout') }}" 
          hx-target="#scheduled-workouts-content" 
          hx-swap="innerHTML">
      <div class="modal-body">
        <input type="hidden" name="event_id" value="{{ event.id }}">
        
        <div class="mb-3">
          <label class="form-label">New Date</label>
          <input type="date" class="form-control" name="new_date" value="{{ event.date }}" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">New Time</label>
          <input type="time" class="form-control" name="new_time" value="{{ event.time }}" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">Reason for Change (Optional)</label>
          <textarea class="form-control" name="reason" rows="2" 
                    placeholder="e.g., Schedule conflict, traveling..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
          <!-- only want to include this code if the event object is not empty and it has a non null 'id' attribute  -->
          {% if event and event['id'] %}
          <button type="button" class="btn btn-danger" 
              hx-post="/schedule/delete_event/{{ event['id'] }}" 
              data-bs-dismiss="modal"
              hx-confirm="Are you sure you want to remove you appointment at the gym?">Remove</button>
          <span class="flex-grow-1"></span>
          {% endif %}          
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-warning" data-bs-dismiss="modal">Reschedule Workout</button>
      </div>
    </form>
  </div>
</div>
