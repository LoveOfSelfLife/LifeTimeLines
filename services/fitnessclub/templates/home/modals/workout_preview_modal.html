<!-- workout_preview_modal.html -->
<div class="modal-dialog modal-lg modal-dialog-scrollable">
  <!-- home/modals/workout_preview_modal.html -->
  <div class="modal-content workout-preview-modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="workout-preview-modal-label">
        <i class="bi bi-eye me-2"></i>Preview of {{ workout_name }}
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
      {% include 'home/modals/_workout_preview.html' %}
    </div>
    <div class="modal-footer">
      {% if back_url and back_url.startswith('/') and not back_url.startswith('//') %}
      <button type="button" class="btn btn-outline-light me-auto"
              hx-get="{{ back_url }}" hx-target="#modals-here" hx-swap="innerHTML">
        <i class="bi bi-arrow-left me-1 text-white"></i> Back to program
      </button>
      {% endif %}
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
    </div>
  </div>
</div>

<style>
  .workout-preview-modal-content {
    background: linear-gradient(180deg, rgba(47, 74, 88, 0.98), rgba(29, 45, 55, 0.98));
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.18);
  }
</style>
