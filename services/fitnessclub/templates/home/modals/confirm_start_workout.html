{# Simple Start Workout Confirmation Dialog #}
<div class="modal fade" id="confirm-start-modal" tabindex="-1" aria-labelledby="confirm-start-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="confirm-start-modal-label">
          <i class="bi bi-play-fill me-2"></i>Start Workout
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <p class="mb-3">Starting <strong>{{ workout_name }}</strong></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <form class="d-inline" method="POST" 
              hx-post="{{ url_for('program.start_workout', workout_key=workout_key) }}"
              hx-target="#content" 
              hx-swap="innerHTML">
          <input type="hidden" name="program_key" value="{{ program_key }}">
          <input type="hidden" name="scheduled_workout_event_id" value="{{ event_id }}">
          <button type="submit" class="btn btn-success" data-bs-dismiss="modal">
            <i class="bi bi-check-lg me-1"></i>OK
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Show the modal after it's loaded via HTMX
  document.addEventListener('DOMContentLoaded', function() {
    const modal = new bootstrap.Modal(document.getElementById('confirm-start-modal'));
    modal.show();
  });
  // If DOM is already loaded (HTMX case), show immediately
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    const modal = new bootstrap.Modal(document.getElementById('confirm-start-modal'));
    modal.show();
  }
</script>
