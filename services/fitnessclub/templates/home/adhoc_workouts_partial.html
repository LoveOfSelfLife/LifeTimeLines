{# Adhoc Workouts Partial Template #}

    <div class="workout-card">
        <div class="card-body p-1">
            <div id="global-workout-selector" class="workout-selector d-flex">
                {% set form_id = 'global-start-form' %}
                {% set select_id = 'global-workout-select' %}
                {% set peek_id = 'peek-workout-btn' %}
                {% set is_adhoc = true %}
                {% set start_btn_class = 'btn-primary' %}
                {% include 'home/_start_workout_controls.html' %}
            </div>
        </div>
    </div>


    <style>
        .custom-select-wrapper {
            position: relative;
            display: inline-block;
        }

        .custom-select {
            appearance: none;
            /* Hides default arrow */
            -webkit-appearance: none;
            padding-right: 30px;
            /* Space for the new icon */
            /* Add your other styling like border and background here */
        }

        .custom-select-wrapper::after {
            content: '\F282';
            /* bi-chevron-down unicode */
            font-family: 'bootstrap-icons';
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            pointer-events: none;
            /* Clicks pass through to select */
        }

        /* Scheduled Workouts Specific Styles */
        .workout-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .workout-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .missed-workout {
            opacity: 0.7;
            border-color: rgba(220, 53, 69, 0.3);
        }

        .workout-name {
            color: #fff;
            font-weight: 600;
        }

        .workout-actions .btn {
            font-size: 0.8rem;
        }

        .team-list .badge {
            font-size: 0.7rem;
        }

        .empty-state i {
            font-size: 4rem;
        }

        /* Responsive adjustments */
        @media (max-width: 767px) {

            /* Override: Keep workout actions in single row on mobile */
            .workout-actions {
                flex-direction: row !important;
                flex-wrap: nowrap !important;
            }

            .workout-actions .btn {
                width: auto !important;
                flex-shrink: 0 !important;
                margin-bottom: 0 !important;
                font-size: 0.7rem;
                /* Slightly smaller on mobile */
            }

            .workout-actions .custom-select-wrapper {
                min-width: 100px !important;
                /* Minimum readable width */
            }

            .workout-actions .form-select {
                font-size: 0.7rem;
                /* Slightly smaller text on mobile */
                padding: 0.25rem 0.5rem;
            }
        }
    </style>
