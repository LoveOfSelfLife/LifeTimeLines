<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ scope | capitalize }} analysis — {{ subject.name or scope | capitalize }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    .pa-chart { width: 100%; }
    .pa-table { font-size: .85rem; }
    @media print {
      .no-print { display: none !important; }
      .pa-chart, .pa-table, .list-group-item, .card { break-inside: avoid; }
      h5 { break-after: avoid; }
    }
  </style>
</head>
<body>
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h3 class="mb-0">{{ subject.name or ('Unnamed ' ~ scope) }}</h3>
      <div class="text-muted small">{{ scope | capitalize }} analysis · {{ 'including' if include_ramp else 'excluding' }} warm-up (RAMP)
        {% if objective %}· objective: {{ objective.name }}{% endif %}</div>
    </div>
    <button class="btn btn-primary no-print" onclick="window.print()"><i class="bi bi-printer"></i> Print / Save as PDF</button>
  </div>
  {% include 'program_analysis/_report_body.html' %}
</div>
</body>
</html>
