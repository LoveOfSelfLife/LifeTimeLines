<div class="modal-dialog modal-dialog-centered">
  <form hx-post="{{ request.path }}" class="modal-content">
    <div class="modal-header text-black">
      <h5 class="modal-title">Schedule recurring workout</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
      {% if error_message %}
      <div class="alert alert-danger" role="alert">
        {{ error_message }}
      </div>
      {% endif %}

      <div class="mb-3">
        <label for="start_date" class="form-label text-white">Start date</label>
        <input
          type="date"
          id="start_date"
          name="start_date"
          class="form-control"
          value="{{ event['start_date'] if event else '' }}"
          required
        >
      </div>

      <div class="mb-3">
        <label for="time" class="form-label text-white">Workout time</label>
        <input
          type="time"
          id="time"
          name="time"
          class="form-control"
          value="{{ event['time'] if event else '' }}"
          required
        >
      </div>

      {% if role_context.role == 'coach' %}
      <div class="mb-3">
        <label for="assigned_member" class="form-label text-white">Assign To:</label>
        <select name="assigned_member_id" id="assigned_member" class="form-select"
                style="color: #212529; background-color: #fff;">
          {% for member in accessible_members %}
          <option value="{{ member.id }}" {% if member.id == (event.assigned_to_member_id or event.member_id) %}selected{% endif %}>
            {{ member.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      <div class="mb-2">
        <label class="form-label text-white">Days of week</label>
      </div>
      <div class="d-flex flex-wrap gap-2">
        {% for day_code, day_label in day_options %}
        <div class="form-check form-check-inline me-3">
          <input
            class="form-check-input"
            type="checkbox"
            id="day_{{ day_code }}"
            name="days"
            value="{{ day_code }}"
            {% if event and event.get('days') and day_code in event.get('days') %}checked{% endif %}
          >
          <label class="form-check-label text-white" for="day_{{ day_code }}">{{ day_label }}</label>
        </div>
        {% endfor %}
      </div>

      <div class="form-text text-white-50 mt-3">
        The first workout is automatically set to the first matching day and time after now.
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">Save recurring schedule</button>
    </div>
  </form>
</div>
