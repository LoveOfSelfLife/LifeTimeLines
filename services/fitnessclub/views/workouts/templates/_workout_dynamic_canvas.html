{% for sec in workout.workout_sections %}
  <div class="card mb-3">
    <div class="card-header">{{ sec.name.title() }}</div>
    <ul class="list-group list-group-flush section-list"
        data-section="{{ sec.name }}">
      {% for item in sec.exercises %}
        {% set ex = exercises[item.id] %}
        <li class="list-group-item py-2 d-flex align-items-center"
            data-exercise-id="{{ item.id }}" data-workout-id="{{ workout.id }}">

          <!-- Drag handle -->
          <span class="drag-handle me-3" style="cursor:grab;">☰</span>

          <div class="flex-fill">
            <div class="d-flex justify-content-between align-items-center">
              <strong>{{ ex.name }}</strong>
              <button
                class="btn btn-link btn-sm text-danger p-0"
                hx-post="{{ url_for('workouts.remove_exercise', workout_id=workout.id) }}"
                hx-vals='{"exercise_id":"{{ item.id }}"}'
                hx-target="#canvas"
                hx-swap="innerHTML"
                title="Remove"
              >&times;</button>
            </div>

            <!-- Reps, Sets, Weight all in one row -->
            <div class="d-flex flex-wrap gap-2 mt-2">
      #       <span id="params-{{ item.id }}-{{ workout.id }}">
                <div id="dynamic-canvas-{{ item.id }}"
                    hx-get="{{ url_for('workouts.dynamic_parameters', workout_id=workout.id, exercise_id=item.id) }}"
                    hx-trigger="load"
                    hx-swap="outerHTML">
                  Loading…
                </div>
              </span>
            </div>  
          </div>

        </li>
      {% endfor %}
    </ul>
  </div>
{% endfor %}
