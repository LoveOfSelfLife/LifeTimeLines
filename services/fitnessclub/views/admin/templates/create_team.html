<!-- Create new team form -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4><i class="bi bi-plus-circle"></i> Create New Team</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> {{ error }}
                    </div>
                    {% endif %}

                    <form hx-post="/admin/teams/create" hx-target="#content" hx-swap="innerHTML">
                        <div class="mb-3">
                            <label for="name" class="form-label">Team Name <span class="text-danger">*</span></label>
                            <input type="text" 
                                   class="form-control" 
                                   id="name" 
                                   name="name" 
                                   value="{{ form_data.name if form_data else '' }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="location" 
                                   name="location" 
                                   value="{{ form_data.location if form_data else '' }}"
                                   placeholder="e.g., Downtown YMCA, Home Gym, etc.">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" 
                                      id="description" 
                                      name="description" 
                                      rows="3"
                                      placeholder="Brief description of the team and its goals">{{ form_data.description if form_data else '' }}</textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="button" 
                                    class="btn btn-secondary" 
                                    hx-get="/admin/teams" 
                                    hx-target="#content" 
                                    hx-swap="innerHTML">
                                <i class="bi bi-arrow-left"></i> Back to Teams
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Create Team
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
