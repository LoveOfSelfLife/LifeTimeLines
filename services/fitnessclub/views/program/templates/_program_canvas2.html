<div class="card mb-3">

    <ul class="list-group list-group-flush workout-list"
        data-section="workouts">

      {% for workout in workouts %}
        <li class="list-group-item py-2 d-flex align-items-center"
            data-workout-id="{{ workout.id }}" data-program-id="{{ program.id }}">

          <!-- Drag handle -->
          <span class="drag-handle me-3" style="cursor:grab;">☰</span>

          <div class="flex-fill">
            <div class="d-flex justify-content-between align-items-center">
              <button
                type="button"
                class="btn btn-outline-secondary btn-xs p-0"
                onclick="toggleWorkoutDetails('{{ workout.id }}', '{{ workout.key_str }}', '{{ program.id }}')"
                title="Edit Workout Details"
              >
                <i class="bi bi-pencil-square"></i>
              </button>
              <div>
                  <div>
                    <div class="d-flex align-items-center">
                      <label for="workout-name-{{ workout.id }}" class="form-label small me-2 mb-0">Workout</label>
                      
                      <form
                            hx-post="{{ url_for('program.update_workout_name', workout_id=workout.id) }}"
                            hx-trigger="change delay:500ms, focusout"
                            hx-swap="none"
                            class="flex-fill">
                        
                        <input
                          type="text" name="workout_name"  id="workout-name-{{ workout.id }}"
                          class="form-control form-control-lg"
                          placeholder="workout name"
                          value="{{ workout.name or '' }}"
                        >
                        
                      </form>
                    </div>
                  </div>
              </div>
              <button
                class="btn btn-link btn-sm text-danger p-0"
                hx-post="{{ url_for('program.edit_workout', program_id=program.id) }}"
                hx-vals='{"workout_id":"{{ workout.id }}"}'
                hx-target="#entities-container"
                hx-swap="innerHTML"
                title="Edit Workout"
              >Edit</button>
              <button
                class="btn btn-link btn-sm text-danger p-0"
                hx-post="{{ url_for('program.remove_workout', program_id=program.id) }}"
                hx-vals='{"workout_id":"{{ workout.id }}"}'
                hx-target="#program-canvas"
                hx-swap="innerHTML"
                title="Remove"
              >&times;</button>
            </div>
          </div>
        </li>
        <!-- Placeholder for workout -->
        <div id="workout-details-{{ workout.id }}" class="mt-2 workout-details"></div>
      {% endfor %}
    </ul>
  </div>
