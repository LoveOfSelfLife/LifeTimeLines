<div class="container-fluid">
  <div class="row">
    <!-- Library sidebar (md+) -->
    <div class="col-md-6 d-none d-md-block border-end vh-100 overflow-auto">
      <!-- <h4 class="mt-3">Exercise Library</h4> -->
      <div id="lib-list" hx-get="{{ url_for('program.workouts_listing',program_id=program.id, target='results-area') }}"
        hx-trigger="load" 
        target='lib-list'
        hx-swap="innerHTML">
        Loading…
      </div>
    </div>


    <!-- Workout canvas -->
    <div class="col-md-6 vh-100 overflow-auto">
      <form>
        <!-- Program details section -->
        <div class="mt-3 mb-4">
          <!-- Row 1: Program Name and Assignment -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="name" class="form-label">Program Name:</label>
              <input type="text" name="name" id="name" class="form-control" value="{{ program.name }}"
                placeholder="Program Name" hx-trigger="change delay:500ms, focusout"
                hx-post="{{ url_for('program.update_program_name', program_id=program.id) }}" hx-swap="none">
            </div>
            {% if role_context.role == 'coach' %}
            <div class="col-md-6">
              <label for="assigned_member" class="form-label">Assign To:</label>
              <select name="assigned_member_id" id="assigned_member" class="form-select"
                style="color: #212529; background-color: #fff;" hx-trigger="change"
                hx-post="{{ url_for('program.update_assigned_member', program_id=program.id) }}" hx-swap="none">
                {% for member in accessible_members %}
                <option value="{{ member.id }}" {% if member.id==(program.assigned_to_member_id or program.member_id)
                  %}selected{% endif %}>
                  {{ member.name }}
                </option>
                {% endfor %}
              </select>
            </div>
            {% endif %}
          </div>

          <!-- Row 2: Dates -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="start_date" class="form-label">Start Date:</label>
              <input type="date" name="start_date" id="start_date" class="form-control" value="{{ program.start_date }}"
                placeholder="Start Date" hx-trigger="change delay:500ms, focusout"
                hx-post="{{ url_for('program.update_dates', program_id=program.id, date_type='start') }}"
                hx-swap="none">
            </div>
            <div class="col-md-6">
              <label for="end_date" class="form-label">End Date:</label>
              <input type="date" name="end_date" id="end_date" class="form-control" value="{{ program.end_date }}"
                placeholder="End Date" hx-trigger="change delay:500ms, focusout"
                hx-post="{{ url_for('program.update_dates', program_id=program.id, date_type='end') }}" hx-swap="none">
            </div>
          </div>

          <!-- Row 3: Action Buttons -->
          <div class="row">
            <div class="col-12">
              <div class="d-flex gap-2">

                <button class="btn btn-success" hx-post="{{ url_for('program.save_program', program_id=program.id) }}"
                  hx-include="form" hx-vals='{"program_id":"{{ program.id }}"}' hx-target="#content"
                  hx-swap="innerHTML">
                  <i class="bi bi-check-circle"></i> Save
                </button>

                <button class="btn btn-success"
                  hx-post="{{ url_for('program.save_copy_of_program', program_id=program.id) }}" hx-include="form"
                  hx-vals='{"program_id":"{{ program.id }}"}' hx-target="#content" hx-swap="innerHTML">
                  <i class="bi bi-copy"></i> Copy
                </button>

                <button class="btn btn-secondary"
                  hx-post="{{ url_for('program.cancel_editing_program', program_id=program.id) }}"
                  hx-vals='{"program_id":"{{ program.id }}"}' hx-target="#content" hx-swap="innerHTML show:top">
                  <i class="bi bi-x-circle"></i> Cancel & Exit
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="row" id="program-canvas" hx-get="{{ url_for('program.program_canvas', program_id=program.id) }}"
          hx-trigger="load" hx-swap="innerHTML">
          Loading…
        </div>
    </div>
    </form>
  </div>
</div>
