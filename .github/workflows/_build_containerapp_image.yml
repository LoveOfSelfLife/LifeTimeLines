# 
# Build & push azure container app
#

name: __Build & Publish Container App image

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
    secrets:
      container_registry:
        required: true
      container_registry_id:
        required: true
      container_registry_pw:
        required: true
      azure_credentials:

jobs:

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    env:
      VERSION: ${{ github.sha }}
      CONTAINER_REGISTRY: ${{ secrets.container_registry }}
      CONTAINER_REGISTRY_ID: ${{ secrets.container_registry_id }}
      CONTAINER_REGISTRY_PW: ${{ secrets.container_registry_pw }}
    
    steps:
      
      # Checks-out your repository under $GITHUB_WORKSPACE.
      - uses: actions/checkout@v2


      - name: Get build information
        run: |
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "BUILD_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

          #
      # Builds the Docker image.
      #
      - name: Build image
        run:  | 
          ./scripts/build_image.sh ${{ inputs.app-name }}

      #
      # Publishes the Docker image to the container registry.
      #
      - name: Publish image to container registry
        run:  |
          ./scripts/push_image.sh ${{ inputs.app-name }}

