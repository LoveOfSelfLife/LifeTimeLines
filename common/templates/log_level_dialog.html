<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="log-level-modal-label">Log Level</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
      <div class="alert alert-info">
        <strong>Current log level:</strong> {{ current_level }}
      </div>

      <form hx-post="/sys/log-level" hx-swap="none">
        <div class="mb-3">
          <label for="log_level" class="form-label">Change log level to:</label>
          <select class="form-select" id="log_level" name="level" required>
            {% for level in levels %}
              <option value="{{ level }}" {% if level == current_level %}selected{% endif %}>{{ level }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">Apply</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
